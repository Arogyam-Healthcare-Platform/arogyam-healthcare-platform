name: arogyam-healthcare-platform

networks:
  arogyam-net:
    driver: bridge
    name: arogyam-net

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  zookeeper-data:
  elasticsearch-data:
  cassandra-data:

services:
  # ==========================================
  # 1. Primary Relational DB (PostgreSQL 16)
  # ==========================================
  postgres-db:
    image: postgis/postgis:16-3.4-alpine
    container_name: arogyam-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - arogyam-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. Redis Cluster / Cache (Redis 7)
  # ==========================================
  redis-cache:
    image: redis:7-alpine
    container_name: arogyam-redis-cache
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - arogyam-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 3. Zookeeper for Kafka Coordination
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: arogyam-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - arogyam-net

  # ==========================================
  # 4. Event Streaming Backbone (Apache Kafka)
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: arogyam-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - arogyam-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ==========================================
  # 5. Edge Reverse Proxy (Kong API Gateway)
  # ==========================================
  kong-gateway:
    image: kong:3.5
    container_name: arogyam-kong-gateway
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/usr/local/kong/declarative/kong.yml"
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
      KONG_LOG_LEVEL: "info"
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8443:8443"
    volumes:
      - ./arogyam-api-gateway/config/kong.yml:/usr/local/kong/declarative/kong.yml
    networks:
      - arogyam-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 6. CQRS Search Engine (Elasticsearch 8)
  # ==========================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: arogyam-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - arogyam-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cat/health | grep -q green || grep -q yellow"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ==========================================
  # 7. NoSQL Real-Time Chat DB (Apache Cassandra)
  # ==========================================
  cassandra-db:
    image: cassandra:4.1
    container_name: arogyam-cassandra-db
    restart: unless-stopped
    environment:
      - CASSANDRA_CLUSTER_NAME=ArogyamChatCluster
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - arogyam-net

  # ==========================================
  # 8. Auth Microservice (Python FastAPI)
  # ==========================================
  auth-service:
    build:
      context: ./arogyam-auth-service
      dockerfile: Dockerfile
    container_name: arogyam-auth-service
    restart: unless-stopped
    environment:
      - POSTGRES_SERVER=postgres-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=arogyam_admin
      - POSTGRES_PASSWORD=arogyam_secure_pass_2026
      - POSTGRES_DB=arogyam_identity
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
    ports:
      - "8005:8005"
      - "50051:50051"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - arogyam-net

  # ==========================================
  # 9. Patient Microservice (Java Spring Boot 3)
  # ==========================================
  patient-service:
    build:
      context: ./arogyam-patient-service
      dockerfile: Dockerfile
    container_name: arogyam-patient-service
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/arogyam_patient
      - SPRING_DATASOURCE_USERNAME=arogyam_admin
      - SPRING_DATASOURCE_PASSWORD=arogyam_secure_pass_2026
      - AUTH_SERVICE_GRPC_HOST=auth-service
      - AUTH_SERVICE_GRPC_PORT=50051
    ports:
      - "8002:8002"
    depends_on:
      - postgres-db
      - auth-service
    networks:
      - arogyam-net

  # ==========================================
  # 10. Doctor Microservice (Java Spring Boot 3)
  # ==========================================
  doctor-service:
    build:
      context: ./arogyam-doctor-service
      dockerfile: Dockerfile
    container_name: arogyam-doctor-service
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/arogyam_doctor
      - SPRING_DATASOURCE_USERNAME=arogyam_admin
      - SPRING_DATASOURCE_PASSWORD=arogyam_secure_pass_2026
      - AUTH_SERVICE_GRPC_HOST=auth-service
      - AUTH_SERVICE_GRPC_PORT=50051
    ports:
      - "8003:8003"
    depends_on:
      - postgres-db
      - auth-service
    networks:
      - arogyam-net

  # ==========================================
  # 11. Appointment Microservice (Python FastAPI)
  # ==========================================
  appointment-service:
    build:
      context: ./arogyam-appointment-service
      dockerfile: Dockerfile
    container_name: arogyam-appointment-service
    restart: unless-stopped
    environment:
      - POSTGRES_SERVER=postgres-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=arogyam_admin
      - POSTGRES_PASSWORD=arogyam_secure_pass_2026
      - POSTGRES_DB=arogyam_appointment
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - AUTH_GRPC_TARGET=auth-service:50051
    ports:
      - "8004:8004"
      - "50054:50054"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - arogyam-net

  # ==========================================
  # 12. High-Speed Go Search Service
  # ==========================================
  search-service:
    build:
      context: ./arogyam-search-service
      dockerfile: Dockerfile
    container_name: arogyam-search-service
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
    ports:
      - "8006:8006"
    networks:
      - arogyam-net

  # ==========================================
  # 13. Push-First Notification Microservice
  # ==========================================
  notification-service:
    build:
      context: ./arogyam-notification-service
      dockerfile: Dockerfile
    container_name: arogyam-notification-service
    restart: unless-stopped
    environment:
      - PORT=8007
      - KAFKA_BROKERS=kafka:9092
      - PUSH_PROVIDER=MOCK
      - EMAIL_PROVIDER=MOCK
      - SMS_PROVIDER=MOCK
    ports:
      - "8007:8007"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - arogyam-net

  # ==========================================
  # 14. Patient Health Record Microservice
  # ==========================================
  health-record-service:
    build:
      context: ./arogyam-health-record-service
      dockerfile: Dockerfile
    container_name: arogyam-health-record-service
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/arogyam_health_record
      - SPRING_DATASOURCE_USERNAME=arogyam_admin
      - SPRING_DATASOURCE_PASSWORD=arogyam_secure_pass_2026
      - AUTH_SERVICE_GRPC_HOST=auth-service
      - AUTH_SERVICE_GRPC_PORT=50051
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8008:8008"
    depends_on:
      postgres-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - arogyam-net

  # ==========================================
  # 15. Billing & Payment Microservice
  # ==========================================
  billing-service:
    build:
      context: ./arogyam-billing-service
      dockerfile: Dockerfile
    container_name: arogyam-billing-service
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/arogyam_billing
      - SPRING_DATASOURCE_USERNAME=arogyam_admin
      - SPRING_DATASOURCE_PASSWORD=arogyam_secure_pass_2026
      - AUTH_SERVICE_GRPC_HOST=auth-service
      - AUTH_SERVICE_GRPC_PORT=50051
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PAYMENT_MODE=MOCK
    ports:
      - "8009:8009"
    depends_on:
      postgres-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - arogyam-net

  # ==========================================
  # 16. Platform Admin Microservice
  # ==========================================
  admin-service:
    build:
      context: ./arogyam-admin-service
      dockerfile: Dockerfile
    container_name: arogyam-admin-service
    restart: unless-stopped
    environment:
      - PORT=8011
      - POSTGRES_SERVER=postgres-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=arogyam_admin
      - POSTGRES_PASSWORD=arogyam_secure_pass_2026
      - POSTGRES_DB=arogyam_admin
      - KAFKA_BROKERS=kafka:9092
    ports:
      - "8011:8011"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - arogyam-net

  # ==========================================
  # 17. Real-Time WebSocket Messaging Microservice
  # ==========================================
  messaging-service:
    build:
      context: ./arogyam-messaging-service
      dockerfile: Dockerfile
    container_name: arogyam-messaging-service
    restart: unless-stopped
    environment:
      - PORT=8010
      - CASSANDRA_HOST=cassandra-db
      - CASSANDRA_PORT=9042
      - CASSANDRA_KEYSPACE=arogyam_messaging
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - KAFKA_BROKERS=kafka:9092
    ports:
      - "8010:8010"
    networks:
      - arogyam-net

  # ==========================================
  # 18. Telemedicine WebRTC Video Call Microservice
  # ==========================================
  video-call-service:
    build:
      context: ./arogyam-video-call-service
      dockerfile: Dockerfile
    container_name: arogyam-video-call-service
    restart: unless-stopped
    environment:
      - PORT=8012
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - KAFKA_BROKERS=kafka:9092
    ports:
      - "8012:8012"
    networks:
      - arogyam-net

  # ==========================================
  # 19. High-Speed Go Audit Microservice
  # ==========================================
  audit-service:
    build:
      context: ./arogyam-audit-service
      dockerfile: Dockerfile
    container_name: arogyam-audit-service
    restart: unless-stopped
    environment:
      - PORT=8013
      - POSTGRES_SERVER=postgres-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=arogyam_admin
      - POSTGRES_PASSWORD=arogyam_secure_pass_2026
      - POSTGRES_DB=arogyam_audit
      - KAFKA_BROKERS=kafka:9092
    ports:
      - "8013:8013"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - arogyam-net

  # ==========================================
  # 20. AI Doctor Recommendation Microservice
  # ==========================================
  ai-analysis-service:
    build:
      context: ./arogyam-ai-analysis-service
      dockerfile: Dockerfile
    container_name: arogyam-ai-analysis-service
    restart: unless-stopped
    environment:
      - PORT=8014
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - KAFKA_BROKERS=kafka:9092
      - RECOMMENDATION_ENGINE=RULE_BASED
    ports:
      - "8014:8014"
    networks:
      - arogyam-net

  # ==========================================
  # 21. Patient Web Portal (React/Vite)
  # ==========================================
  patient-portal:
    build:
      context: ./arogyam-patient-portal
      dockerfile: Dockerfile
    container_name: arogyam-patient-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - arogyam-net

  # ==========================================
  # 22. Doctor Practice Portal (React/Vite)
  # ==========================================
  doctor-portal:
    build:
      context: ./arogyam-doctor-portal
      dockerfile: Dockerfile
    container_name: arogyam-doctor-portal
    restart: unless-stopped
    ports:
      - "3001:3001"
    networks:
      - arogyam-net

  # ==========================================
  # 23. Admin & Governance Portal (React/Vite)
  # ==========================================
  admin-portal:
    build:
      context: ./arogyam-admin-portal
      dockerfile: Dockerfile
    container_name: arogyam-admin-portal
    restart: unless-stopped
    ports:
      - "3002:3002"
    networks:
      - arogyam-net









